<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} · Stock News</title>
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("daily-digest-theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --page-bg: #eef1f5;
      --card-bg: #ffffff;
      --muted-bg: #f8fafc;
      --text: #1a1a2e;
      --text-strong: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --text-label: #64748b;
      --border: #e8ecf0;
      --border-strong: #e2e8f0;
      --link: #1d4ed8;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      --section-max: 960px;
    }
    html[data-theme="dark"] {
      --page-bg: #0b1220;
      --card-bg: #111827;
      --muted-bg: #1e293b;
      --text: #e2e8f0;
      --text-strong: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-label: #94a3b8;
      --border: #334155;
      --border-strong: #334155;
      --link: #93c5fd;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }
    body {
      margin: 0;
      padding: 12px;
      background: var(--page-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: var(--section-max); margin: 0 auto; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
      max-width: 560px;
      margin: 0 auto;
    }
    .eyebrow {
      margin: 0 0 8px;
      font-size: 11px;
      color: var(--text-label);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      font-weight: 800;
      color: var(--text-strong);
      letter-spacing: -0.02em;
    }
    .message {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--text-secondary);
    }
    .detail {
      margin: 0 0 20px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
    }
    .actions a {
      color: var(--link);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .actions a:hover { text-decoration: underline; }
    .btn-primary {
      display: inline-block;
      padding: 10px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #f87171 0%, #b91c1c 100%);
    }
    @media (min-width: 768px) {
      body { padding: 24px 16px; }
      .card { padding: 40px 32px; }
    }
    @media (max-width: 767px) {
      .card { border-radius: 12px; padding: 24px 20px; }
      .btn-primary {
        display: block;
        text-align: center;
        min-height: 44px;
        line-height: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <p class="eyebrow">Stock News</p>
      <h1>{{ title }}</h1>
      <p class="message">{{ message }}</p>
      {% if detail %}
      <p class="detail">{{ detail }}</p>
      {% endif %}
      <div class="actions">
        <a class="btn-primary" href="{{ site_url or '/' }}">Back to home</a>
        {% if subscribe_enabled %}
        <a href="{{ site_url or '/' }}#subscribe">Subscribe</a>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
