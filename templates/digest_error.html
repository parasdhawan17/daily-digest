<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} · Tickr Digest</title>
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("daily-digest-theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --page-bg: #f5f7fb;
      --card-bg: #ffffff;
      --muted-bg: #edf2f7;
      --text: #132238;
      --text-strong: #132238;
      --text-secondary: #526176;
      --text-muted: #68778b;
      --text-label: #526176;
      --border: #d8e0ea;
      --border-strong: #c7d2df;
      --link: #365cf5;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      --section-max: 960px;
    }
    html[data-theme="dark"] {
      --page-bg: #0b1420;
      --card-bg: #121f2f;
      --muted-bg: #19283a;
      --text: #f3f7fa;
      --text-strong: #f3f7fa;
      --text-secondary: #a9b7c6;
      --text-muted: #8999ac;
      --text-label: #a9b7c6;
      --border: #2c3d51;
      --border-strong: #40536a;
      --link: #8ea2ff;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }
    body {
      margin: 0;
      padding: 12px;
      background: var(--page-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: var(--section-max); margin: 0 auto; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
      max-width: 560px;
      margin: 0 auto;
    }
    .eyebrow {
      margin: 0 0 8px;
      font-size: 11px;
      color: var(--text-label);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      font-weight: 800;
      color: var(--text-strong);
      letter-spacing: -0.02em;
    }
    .message {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--text-secondary);
    }
    .detail {
      margin: 0 0 20px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
    }
    .actions a {
      color: var(--link);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .actions a:hover { text-decoration: underline; }
    .btn-primary {
      display: inline-block;
      padding: 10px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #365cf5 0%, #2948d6 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4e70f8 0%, #213dc0 100%);
    }
    @media (min-width: 768px) {
      body { padding: 24px 16px; }
      .card { padding: 40px 32px; }
    }
    @media (max-width: 767px) {
      .card { border-radius: 12px; padding: 24px 20px; }
      .btn-primary {
        display: block;
        text-align: center;
        min-height: 44px;
        line-height: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <p class="eyebrow"><img src="/assets/tickr-digest-logo.png" alt="tickr digest." width="181" height="38"></p>
      <h1>{{ title }}</h1>
      <p class="message">{{ message }}</p>
      {% if detail %}
      <p class="detail">{{ detail }}</p>
      {% endif %}
      <div class="actions">
        <a class="btn-primary" href="{{ site_url or '/' }}">Back to home</a>
        {% if subscribe_enabled %}
        <a href="{{ site_url or '/' }}#subscribe">Subscribe</a>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
